# FreeFrame remote transcoder
#
# Deploy this file as a separate Coolify application on the processing host.
# It intentionally starts no API, web, database, Redis, or MinIO service. All
# connections point to the primary FreeFrame deployment through private routes.
#
# Never expose PostgreSQL or Redis publicly. Connect the hosts with WireGuard,
# Tailscale, or another VPN and use private addresses in DATABASE_URL/REDIS_URL.

services:
  transcoding_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_STORAGE: ${S3_STORAGE:-minio}
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Must be reachable from this host. Do not use the primary Compose-only
      # hostname `http://minio:9000` here.
      S3_ENDPOINT: ${S3_ENDPOINT}
      # Not needed by the worker itself, but accepted when a deployment uses a
      # different public endpoint for signed URLs.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      TRANSCODER_ENGINE: ${TRANSCODER_ENGINE:-ffmpeg}
      TRANSCODER_PRESET: ${TRANSCODER_PRESET:-veryfast}
      TRANSCODING_CONCURRENCY: ${TRANSCODING_CONCURRENCY:-1}
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
    command: >
      sh -c "celery -A apps.api.tasks.celery_app worker
      --hostname=transcoder@%h
      --queues=transcoding
      --concurrency=$${TRANSCODING_CONCURRENCY:-1}
      --prefetch-multiplier=1
      --loglevel=$${CELERY_LOG_LEVEL:-info}"
    # Graceful Coolify stops let an active FFmpeg process finish. If the host
    # dies abruptly, process_asset's late acknowledgement enables redelivery.
    stop_grace_period: 15m
    restart: unless-stopped
