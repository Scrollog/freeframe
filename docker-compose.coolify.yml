# ============================================================
# FreeFrame — Docker Compose para Coolify
# ============================================================
# Diferenças em relação a docker-compose.prod.yml:
#   - SEM serviço traefik  -> o proxy do Coolify já ocupa as portas 80/443
#   - SEM env_file .env.prod -> o Coolify injeta as variáveis; aqui elas são
#     mapeadas explicitamente em `environment:` de cada serviço
#   - MinIO habilitado (storage no próprio host)
#
# No Coolify, defina o domínio de cada serviço no campo "Domains":
#   web    -> https://frame.scr0ll.co         (porta 3000)
#   api    -> https://frameapi.scr0ll.co      (porta 8000)
#   minio  -> https://framestorage.scr0ll.co  (porta 9000)
#
# DNS verificado: os 3 já resolvem para 64.181.168.114.
# Host: Oracle ARM (aarch64), 2 vCPU — todas as imagens usadas têm arm64.
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freeframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-freeframe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-freeframe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Object storage no próprio host ─────────────────────────
  # O navegador acessa as URLs assinadas diretamente, por isso o MinIO
  # PRECISA de um domínio público (storage.SEU-DOMINIO.com -> porta 9000).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_CORS_ALLOW_ORIGIN: ${FRONTEND_URL}
      MINIO_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE,HEAD
      MINIO_CORS_ALLOW_HEADERS: "*"
      MINIO_CORS_EXPOSE_HEADERS: ETag,Content-Length,x-amz-request-id
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-freeframe}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET};
      exit 0;
      "
    restart: "no"

  # ─── API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DISABLE_DOCS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-freeframe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freeframe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_STORAGE: minio
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FreeFrame}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      AWS_MAIL_ACCESS_KEY_ID: ${AWS_MAIL_ACCESS_KEY_ID:-}
      AWS_MAIL_SECRET_ACCESS_KEY: ${AWS_MAIL_SECRET_ACCESS_KEY:-}
      AWS_MAIL_REGION: ${AWS_MAIL_REGION:-us-east-1}
      API_WORKERS: ${API_WORKERS:-4}
      TRANSCODER_ENGINE: ${TRANSCODER_ENGINE:-ffmpeg}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-0}
      SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-30}
      ORPHAN_SWEEP_GRACE_HOURS: ${ORPHAN_SWEEP_GRACE_HOURS:-0}
      ORPHAN_SWEEP_DELETE: ${ORPHAN_SWEEP_DELETE:-false}
      TRANSCODING_CONCURRENCY: ${TRANSCODING_CONCURRENCY:-2}
      EMAIL_CONCURRENCY: ${EMAIL_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "cd /workspace/apps/api && alembic upgrade head && cd /workspace &&
      gunicorn apps.api.main:app
      -w $${API_WORKERS:-4}
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ─── Workers Celery (mesma imagem da API, sem domínio) ──────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freeframe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freeframe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_STORAGE: minio
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      TRANSCODER_ENGINE: ${TRANSCODER_ENGINE:-ffmpeg}
      TRANSCODING_CONCURRENCY: ${TRANSCODING_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "celery -A apps.api.tasks.celery_app worker -Q transcoding -c $${TRANSCODING_CONCURRENCY:-2} --loglevel=warning"
    # TRANSCODING_CONCURRENCY limita tarefas Celery, NAO o ffmpeg por dentro:
    # sem -threads o libx264 usa todos os nucleos, entao um job ocupa a maquina
    # (medido: 555% de CPU num host de 8 nucleos, com duas stacks Supabase ao lado).
    #
    # Peso relativo, nao teto: com a maquina ociosa o worker usa todos os nucleos
    # normalmente e o video fica pronto na velocidade maxima. Abaixo do padrao
    # (1024), ele so cede a vez quando ha disputa real — preservando a UI, a API
    # e as outras apps sem custo nenhum em horario vazio.
    #
    # Um teto rigido (`cpus:`) foi avaliado e descartado de proposito: cortaria a
    # velocidade do encode 24h por dia para resolver contencao que so acontece as
    # vezes. Parametros de encoding (preset fast, CRF 20/22/26) intactos.
    cpu_shares: 512
    restart: unless-stopped

  email_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freeframe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freeframe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FreeFrame}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      AWS_MAIL_ACCESS_KEY_ID: ${AWS_MAIL_ACCESS_KEY_ID:-}
      AWS_MAIL_SECRET_ACCESS_KEY: ${AWS_MAIL_SECRET_ACCESS_KEY:-}
      AWS_MAIL_REGION: ${AWS_MAIL_REGION:-us-east-1}
      EMAIL_CONCURRENCY: ${EMAIL_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "celery -A apps.api.tasks.celery_app worker -Q email_high,email_low -c $${EMAIL_CONCURRENCY:-2} --loglevel=warning"
    restart: unless-stopped

  maintenance_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freeframe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freeframe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_STORAGE: minio
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-30}
      ORPHAN_SWEEP_GRACE_HOURS: ${ORPHAN_SWEEP_GRACE_HOURS:-0}
      ORPHAN_SWEEP_DELETE: ${ORPHAN_SWEEP_DELETE:-false}
      MAINTENANCE_CONCURRENCY: ${MAINTENANCE_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "celery -A apps.api.tasks.celery_app worker -Q maintenance -c $${MAINTENANCE_CONCURRENCY:-1} --loglevel=warning"
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freeframe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freeframe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-freeframe}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "celery -A apps.api.tasks.celery_app beat --loglevel=warning -s /tmp/celerybeat-schedule"
    restart: unless-stopped

  # ─── Frontend ───────────────────────────────────────────────
  # ATENÇÃO: NEXT_PUBLIC_API_URL é lido em BUILD TIME (fica embutido no bundle).
  # No Coolify, marque essa variável como "Build Variable". Mudou o domínio da
  # API? Precisa refazer o build do web, não só reiniciar.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_UPLOAD_CONCURRENCY: ${NEXT_PUBLIC_UPLOAD_CONCURRENCY:-5}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
